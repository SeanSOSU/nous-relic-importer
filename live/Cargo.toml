[package]
name = "sync-live"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "The live importer the desktop and Android apps share: the game's captured packets in, the account out to every StarRailSim page connected"

[dependencies]
# Keep this tag the same as the app's, core's and the decoder's; tools/update-reliquary.ps1 sets all of them.
reliquary = { git = "https://github.com/IceDynamix/reliquary", tag = "v24.0.0", features = ["proto-rqa"] }
sync-core = { path = "../core", features = ["stream"] }

axum = { version = "0.8", features = ["ws"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net", "io-util"] }
tracing = "0.1"

[dev-dependencies]
# Writes the game messages the decoder tests send after a recorded login; reliquary's own version, which
# tools/update-reliquary.ps1 copies.
protobuf = "=3.7.1"
