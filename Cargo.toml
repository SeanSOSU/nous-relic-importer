[workspace]
members = ["core", "decoder", "tools/release"]

[package]
name = "nous-relic-importer"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Keeps StarRailSim's relic inventory in step with your game account, read from the game's own network traffic"

[dependencies]
# The packet decoder. Its protobuf types change with every game version: on each patch, re-vendor the exporter
# with tools/update-exporter.ps1 and set this tag (and core's, both entries) to the one it prints.
reliquary = { git = "https://github.com/IceDynamix/reliquary", tag = "v24.0.0", features = ["proto-rqa"] }
sync-core = { path = "core", features = ["stream"] }

axum = { version = "0.8", features = ["ws"] }
futures = "0.3"
# Checks an update's signature against the release key built in (update-key.pub).
minisign-verify = "0.2"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The update check and download: rustls with its own root certificates, the ureq core's build script already uses.
ureq = { version = "2.12.1", default-features = false, features = ["tls"] }

[target.'cfg(windows)'.dependencies]
pktmon = { version = "0.6.2", features = ["tokio"] }
tao = "0.37"
tray-icon = "0.26"
wry = "0.57"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.3.6"
libc = "0.2"

[dev-dependencies]
# Signs test builds for the update tests, as tools/release does for real ones.
minisign = "0.7"
# Writes the game messages the capture test sends after a recorded login; reliquary's own version.
protobuf = "=3.7.1"
roxmltree = "0.20"

[build-dependencies]
winres = "0.1.12"

[profile.dev]
# The game's KCP header uses a field the kcp crate adds to; see reliquary-archiver's Cargo.toml.
overflow-checks = false

[profile.release]
opt-level = "s"
lto = true
overflow-checks = false
