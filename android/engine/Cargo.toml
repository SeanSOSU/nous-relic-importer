[package]
name = "nri-android"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "The Android app's engine: PCAPdroid's capture of the game in, the account out to StarRailSim pages, behind two JNI calls"
publish = false

[lib]
name = "nri"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
serde_json = "1"
sync-live = { path = "../../live" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
