[package]
name = "nri-android"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "The Android app's engine: its VPN for the game, the account read on the way through, served to StarRailSim pages"
publish = false

[lib]
name = "nri"
crate-type = ["cdylib"]

[dependencies]
# The relay's user-space TCP/IP stack (Apache-2.0).
ipstack = "1.0"
futures = "0.3"
jni = "0.21"
serde_json = "1"
sync-core = { path = "../../core" }
sync-live = { path = "../../live" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "io-util", "time", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
