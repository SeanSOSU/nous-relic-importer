<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<title>StarRailSim Sync</title>
<style>
  :root {
    --page: #0a0f1c;
    --ink: #e8eefc;
    --ink-2: #a6b3cc;
    --muted: #6f7d99;
    --line: rgba(232, 238, 252, 0.12);
    --ok: #199e70;
    --warn: #d9a441;
    --idle: #8a8f98;
    --btn: linear-gradient(100deg, #199e70, #0f8a8a);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  html { background: radial-gradient(120% 60% at 50% -10%, rgba(25, 158, 112, 0.18), transparent 60%), var(--page); }
  /* In a browser tab (Linux) the page keeps the window's width, centred. */
  body {
    max-width: 460px;
    margin: 0 auto;
    color: var(--ink);
    font: 14px/1.5 system-ui, "Segoe UI", sans-serif;
    user-select: none;
    display: flex;
    flex-direction: column;
    padding: 18px 28px 16px;
  }

  /* The picture at the top: radar rings around the mark while it waits, the account's faces once synced. */
  .hero { height: 132px; display: flex; align-items: center; justify-content: center; position: relative; }
  .radar { position: relative; width: 120px; height: 120px; display: grid; place-items: center; }
  .radar .ring {
    position: absolute; inset: 30px; border-radius: 50%;
    border: 2px solid var(--tone, var(--idle)); opacity: 0;
    animation: radar 2.6s cubic-bezier(.2, .6, .3, 1) infinite;
  }
  .radar .ring:nth-child(2) { animation-delay: .85s; }
  .radar .ring:nth-child(3) { animation-delay: 1.7s; }
  @keyframes radar { 0% { transform: scale(.7); opacity: .7; } 100% { transform: scale(2); opacity: 0; } }
  .radar .core {
    width: 56px; height: 56px; border-radius: 50%;
    background: radial-gradient(circle, #fff 0 32%, var(--tone, var(--idle)) 34%);
    box-shadow: 0 0 24px color-mix(in srgb, var(--tone, var(--idle)) 45%, transparent);
  }
  .radar[data-still="true"] .ring { animation: none; opacity: 0; }

  .faces { display: flex; justify-content: center; }
  .faces img {
    width: 58px; height: 58px; border-radius: 50%; object-fit: cover;
    background: #141c2e; border: 2px solid var(--page); margin-left: -12px;
    box-shadow: 0 2px 10px rgba(0, 0, 0, .45);
    animation: rise .5s ease-out both;
  }
  .faces img:first-child { margin-left: 0; width: 72px; height: 72px; border-color: var(--ok); }
  @keyframes rise { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }

  .state { margin-top: 6px; display: flex; align-items: center; gap: 12px; }
  .dot { position: relative; flex: none; width: 12px; height: 12px; border-radius: 50%; background: var(--idle); }
  .dot[data-tone="ok"] { background: var(--ok); }
  .dot[data-tone="warn"] { background: var(--warn); }
  .dot i { position: absolute; inset: 0; border-radius: 50%; background: inherit; opacity: 0; }
  .dot[data-live="true"] i { animation: pulse 2s ease-out infinite; }
  @keyframes pulse { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(3); opacity: 0; } }
  .state h2 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  .account { margin: 2px 0 0 24px; color: var(--muted); font-size: 13px; min-height: 20px; }

  .stats { display: flex; gap: 28px; margin: 16px 0 0 24px; }
  .stats b { display: block; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stats span { color: var(--muted); font-size: 12px; }
  .sets { display: flex; gap: 14px; margin: 14px 0 0 24px; }
  .sets figure { margin: 0; display: flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 13px; }
  .sets img { width: 30px; height: 30px; object-fit: contain; }

  .detail { margin: 16px 0 0; color: var(--ink-2); }
  .primary {
    margin-top: 16px; align-self: flex-start;
    font: inherit; font-weight: 600; color: #fff;
    background: var(--btn); border: none; border-radius: 8px; padding: 9px 18px; cursor: pointer;
  }
  .primary:hover { filter: brightness(1.08); }

  .settings { margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--line); }
  label.toggle { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  label.toggle input { width: 16px; height: 16px; accent-color: var(--ok); margin: 0; }
  label.toggle[aria-disabled="true"] { cursor: default; color: var(--muted); }
  .hint { margin: 4px 0 0 26px; color: var(--muted); font-size: 12px; }

  footer { margin-top: auto; padding-top: 12px; display: flex; align-items: center; gap: 14px; color: var(--muted); font-size: 12px; }
  footer p { margin: 0; flex: 1; }
  footer button { font: inherit; color: var(--ink-2); background: none; border: none; padding: 0; cursor: pointer; }
  footer button:hover { color: var(--ink); text-decoration: underline; }
  [hidden] { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    .radar .ring, .dot i, .faces img { animation: none !important; }
  }
</style>
</head>
<body>
  <section class="hero" aria-hidden="true">
    <div class="radar" id="radar"><span class="ring"></span><span class="ring"></span><span class="ring"></span><span class="core"></span></div>
    <div class="faces" id="faces" hidden></div>
  </section>

  <div class="state" role="status">
    <span class="dot" id="dot"><i id="ripple"></i></span>
    <h2 id="headline">Starting…</h2>
  </div>
  <p class="account" id="account"></p>
  <div class="stats" id="stats" hidden>
    <div><b id="n-relics"></b><span>relics</span></div>
    <div><b id="n-cones"></b><span>light cones</span></div>
    <div><b id="n-chars"></b><span>characters</span></div>
  </div>
  <div class="sets" id="sets" hidden></div>
  <p class="detail" id="detail"></p>

  <button class="primary" type="button" id="open">Open StarRailSim</button>

  <section class="settings">
    <label class="toggle" id="startup-label">
      <input type="checkbox" id="startup">
      <span id="startup-text">Start with Windows</span>
    </label>
    <p class="hint" id="startup-hint"></p>
  </section>

  <footer>
    <p>Closing this window keeps sync running in the background. <span id="version"></span></p>
    <button type="button" id="saved-file" hidden>Saved file</button>
    <button type="button" id="uninstall" hidden>Uninstall</button>
    <button type="button" id="quit">Quit</button>
  </footer>

<script>
  const $ = (id) => document.getElementById(id);
  const TONES = { ok: "#199e70", warn: "#d9a441", idle: "#8a8f98" };

  // In a browser (the Linux app opens its window there) the app's local socket stands in for the web view's
  // bridge. The page's own address carries the token the socket asks for.
  if (!window.ipc && location.protocol === "http:") {
    const waiting = [];
    const socket = new WebSocket(`ws://${location.host}/ui${location.search}`);
    socket.onopen = () => waiting.splice(0).forEach((m) => socket.send(m));
    socket.onmessage = (e) => window.render(JSON.parse(e.data));
    socket.onclose = () => {
      $("headline").textContent = "StarRailSim Sync is not running";
      $("detail").textContent = "Start it from your app menu, then reload this page.";
      document.documentElement.style.setProperty("--tone", TONES.warn);
      Object.assign($("dot").dataset, { tone: "warn", live: "false" });
      document.querySelectorAll("button, input").forEach((el) => (el.disabled = true));
    };
    window.ipc = { postMessage: (m) => (socket.readyState === WebSocket.OPEN ? socket.send(m) : waiting.push(m)) };
  }
  const send = (message) => window.ipc && window.ipc.postMessage(message);

  // StarRailRes art, the same sources the site uses: jsDelivr first, GitHub raw when an edge refuses.
  const ART = ["https://cdn.jsdelivr.net/gh/Mar-7th/StarRailRes@master/", "https://raw.githubusercontent.com/Mar-7th/StarRailRes/master/"];
  function art(path) {
    const img = new Image();
    let source = 0;
    img.alt = "";
    img.decoding = "async";
    img.onerror = () => (++source < ART.length ? (img.src = ART[source] + path) : img.remove());
    img.src = ART[0] + path;
    return img;
  }

  const when = (ms, fresh) => {
    const d = new Date(ms);
    const today = d.toDateString() === new Date().toDateString();
    const time = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    const stamp = today ? time : d.toLocaleDateString([], { month: "short", day: "numeric" }) + ", " + time;
    return (fresh ? "updated " : "saved ") + stamp;
  };

  let drawn = { faces: "", sets: "", updatedAt: null };
  window.render = (s) => {
    const synced = s.summary && s.updatedAt;
    $("version").textContent = "v" + s.version;
    document.documentElement.style.setProperty("--tone", TONES[s.tone] || TONES.idle);
    $("dot").dataset.tone = s.tone;
    $("dot").dataset.live = String(s.live);
    $("headline").textContent = s.headline;
    $("detail").textContent = s.detail;
    $("account").textContent = [
      s.uid ? "UID " + s.uid : null,
      s.summary && s.summary.trailblazer ? s.summary.trailblazer : null,
      s.updatedAt ? when(s.updatedAt, s.fresh) : null,
    ].filter(Boolean).join(" · ");

    // A new import restarts the ripple, so each one is seen to land.
    if (s.live && drawn.updatedAt !== null && s.updatedAt !== drawn.updatedAt) {
      const ripple = $("ripple");
      ripple.replaceWith(ripple.cloneNode());
    }
    drawn.updatedAt = s.updatedAt;

    $("radar").hidden = Boolean(synced);
    $("radar").dataset.still = String(s.tone === "warn");
    $("faces").hidden = !synced;
    $("stats").hidden = !synced;
    $("sets").hidden = !synced;
    if (synced) {
      const sm = s.summary;
      $("n-relics").textContent = sm.relics.toLocaleString();
      $("n-cones").textContent = sm.lightCones.toLocaleString();
      $("n-chars").textContent = sm.characters.toLocaleString();
      // Pictures are rebuilt only when WHO is shown changes, never on a plain update.
      const faces = sm.featured.join(",");
      if (faces !== drawn.faces) {
        $("faces").replaceChildren(...sm.featured.map((id, i) => {
          const img = art("icon/character/" + id + ".png");
          img.style.animationDelay = i * 60 + "ms";
          return img;
        }));
        drawn.faces = faces;
      }
      const sets = sm.topSets.map(([id, n]) => id + ":" + n).join(",");
      if (sets !== drawn.sets) {
        $("sets").replaceChildren(...sm.topSets.map(([id, n]) => {
          const figure = document.createElement("figure");
          figure.append(art("icon/relic/" + id + ".png"), "×" + n);
          return figure;
        }));
        drawn.sets = sets;
      }
    }

    $("startup-text").textContent = s.startupLabel || "Start with Windows";
    $("startup").checked = s.startup;
    $("startup").disabled = !s.installed;
    $("startup-label").setAttribute("aria-disabled", String(!s.installed));
    $("startup-hint").textContent = s.installed
      ? s.startupHint || "Starts quietly when you sign in, so it is already running before you open the game."
      : "Available once installed: run the downloaded file without --portable.";
    $("uninstall").hidden = !s.installed;
    $("saved-file").hidden = !s.savedFile;
    $("saved-file").title = s.savedFile || "";
  };

  $("open").addEventListener("click", () => send("open-site"));
  $("saved-file").addEventListener("click", () => send("show-file"));
  $("startup").addEventListener("change", (e) => send(e.target.checked ? "startup-on" : "startup-off"));
  $("quit").addEventListener("click", () => send("quit"));
  $("uninstall").addEventListener("click", () => {
    if (confirm("Uninstall StarRailSim Sync? It stops syncing and removes itself from this computer.")) send("uninstall");
  });
  document.addEventListener("contextmenu", (e) => e.preventDefault());
  send("ready");
</script>
</body>
</html>
